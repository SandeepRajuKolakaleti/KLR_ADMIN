<main class="main-wrap">
    <section class="content-main">
        <div class="content-header">
            <div>
                <h2 class="content-title card-title">{{ 'ORDERSLIST'| translate}}</h2>
                <p>Order list goes here...</p>
            </div>
            <div>
                <a href="javascript:void(0)" class="btn btn-light rounded font-md">Export</a>
            </div>
        </div>
        <div class="card mb-4">
            <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

                <!-- Checkbox Column -->
                <ng-container matColumnDef="select">
                  <th mat-header-cell *matHeaderCellDef>
                    <mat-checkbox (change)="$event ? masterToggle() : null"
                                  [checked]="selection.hasValue() && isAllSelected()"
                                  [indeterminate]="selection.hasValue() && !isAllSelected()"
                                  [aria-label]="checkboxLabel()">
                    </mat-checkbox>
                  </th>
                  <td mat-cell *matCellDef="let row">
                    <mat-checkbox (click)="$event.stopPropagation()"
                                  (change)="$event ? selection.toggle(row) : null"
                                  [checked]="selection.isSelected(row)"
                                  [aria-label]="checkboxLabel(row)">
                    </mat-checkbox>
                  </td>
                </ng-container>
              
                <!-- Order ID Column -->
                <ng-container matColumnDef="orderId">
                  <th mat-header-cell *matHeaderCellDef> Order ID </th>
                  <td mat-cell *matCellDef="let order"> {{order.OrderNumber}} </td>
                </ng-container>

                <!-- Customer Column -->
                <ng-container matColumnDef="customer">
                  <th mat-header-cell *matHeaderCellDef> Customer </th>
                  <td mat-cell *matCellDef="let order"> {{order.UserName}} </td>
                </ng-container>

                <!-- Date Column -->
                <ng-container matColumnDef="date">
                  <th mat-header-cell *matHeaderCellDef> Date </th>
                  <td mat-cell *matCellDef="let order"> {{order.OrderDate | date}} </td>
                </ng-container>

                <!-- Amount Column -->
                <ng-container matColumnDef="amount">
                  <th mat-header-cell *matHeaderCellDef> Amount </th>
                  <td mat-cell *matCellDef="let order"> ${{order.TotalAmount}} </td>
                </ng-container>

                <!-- Status Column -->
                <ng-container matColumnDef="status">
                  <th mat-header-cell *matHeaderCellDef> Status </th>
                  <td mat-cell *matCellDef="let order"> {{order.Status}} </td>
                </ng-container>

                <!-- Total Column -->
                <ng-container matColumnDef="total">
                  <th mat-header-cell *matHeaderCellDef> Total </th>
                  <td mat-cell *matCellDef="let order"> ${{order.TotalAmount}} </td>
                </ng-container>

                <!-- Total Column -->
                <ng-container matColumnDef="transactionId">
                  <th mat-header-cell *matHeaderCellDef> Transaction ID </th>
                  <td mat-cell *matCellDef="let order"> {{order.TransactionId}} </td>
                </ng-container>

                <!-- Action Column -->
                <ng-container matColumnDef="actions">
                  <th mat-header-cell *matHeaderCellDef> Action </th>
                  <td mat-cell *matCellDef="let element" class="content-action-btn">
                    <a href="Javascript:void(0)" (click)="view(element, $event)" class="btn btn-sm font-sm rounded btn-brand"> <i class="material-icons md-visibility"></i> View </a>
                    <!-- @if(userRole === appConstants.userRole.admin) {
                      <button href="Javascript:void(0)" (click)="delete(element, $event)" class="btn btn-sm font-sm btn-light rounded"> <i class="material-icons md-delete_forever"></i> Delete </button>
                    } -->
                  </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;sticky: true"
                  (click)="selection.toggle(row)">
                </tr>
            </table>
        </div>
        <!-- card end// -->
        <div class="pagination-area mt-30 mb-50">
            <mat-paginator #paginator
              [length]="total"
              [pageSize]="limit"
              [pageSizeOptions]="[10, 20, 50, 100]"
              (page)="pageChanged($event)" showFirstLastButtons>
            </mat-paginator>
        </div>
    </section>
</main>
